<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNI AQUA チャプター運営ガイド</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="content.js"></script>
<style>
:root {
  /* ── Artwork palette: white ground + bright BNI red ── */
  --paper:     #FFFFFF;
  --paper-2:   #F5F4F2;
  --white:     #FFFFFF;
  --ink:       #1F1F1F;
  --ink-2:     #555555;
  --ink-3:     #888888;
  --ink-4:     #B5B5B5;
  --line:      #E4E4E4;
  --line-2:    #EFEFEF;
  --line-soft: #F7F7F6;
  --red:       #D11F2A;
  --red-deep:  #A8161F;
  --red-wash:  #FCEEF0;
  --red-soft:  #F3D4D8;
  --green:     #3F8A3F;
  --green-wash:#EAF4EA;
  --amber:     #B0820E;
  --amber-wash:#FBF0D6;
  --night:     #1E1E1E;
  --banner:    linear-gradient(180deg, #D8313B 0%, #C71B26 100%);

  /* Artwork uses gothic everywhere — repoint serif & mono to the sans stack */
  --serif: 'Noto Sans JP', "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --sans:  'Noto Sans JP', "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --mono:  'Noto Sans JP', "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --max:   1080px;
  --pad:   48px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--paper);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.78;
  font-feature-settings: "palt";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* TYPE */
a { color: var(--red); text-decoration: none; transition: color .15s; }
a:hover { color: var(--red-deep); }
strong { color: var(--ink); font-weight: 700; }
em { font-style: normal; color: var(--red); font-weight: 700; }
hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }

/* ─────────────────────────────────── HEADER (red banner) */
header {
  background: var(--banner);
  border-bottom: 0;
  padding: 44px 0 36px;
}
.hdr-inner {
  max-width: var(--max);
  margin: 0 auto;
  padding: 0 var(--pad);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 0;
}
.hdr-eye { display: none; }
h1 {
  font-family: var(--sans);
  font-weight: 900;
  font-size: clamp(30px, 5.2vw, 50px);
  color: #fff;
  line-height: 1.2;
  letter-spacing: 0.01em;
}
h1 em { color: #fff; font-style: normal; font-weight: 900; }
.hdr-sub {
  font-family: var(--sans);
  font-weight: 500;
  font-size: 14.5px;
  color: rgba(255,255,255,.9);
  margin-top: 12px;
  letter-spacing: 0.03em;
  font-feature-settings: "palt";
}
.hdr-leaders {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px 24px;
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid rgba(255,255,255,.25);
  width: 100%;
  max-width: 640px;
}
.hdr-leaders::before {
  content: 'Leadership';
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,.7);
  width: 100%;
  text-align: center;
  margin-bottom: 4px;
}
.ldr {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 0;
  border-bottom: 0;
}
.ldr .role {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,.7);
}
.ldr .name {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 14.5px;
  color: #fff;
  letter-spacing: 0.02em;
}

/* ─────────────────────────────────── TAB NAV */
.tab-nav {
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: saturate(1.4) blur(8px);
  -webkit-backdrop-filter: saturate(1.4) blur(8px);
}
.tab-nav-inner {
  max-width: var(--max);
  margin: 0 auto;
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 var(--pad);
  gap: 0;
}
.tab-nav-inner::-webkit-scrollbar { display: none; }
.tab-btn {
  background: none; border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  padding: 14px 16px 13px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-3);
  cursor: pointer;
  white-space: nowrap;
  transition: color .15s, border-color .15s;
  letter-spacing: 0.04em;
  display: flex; align-items: baseline; gap: 8px;
}
.tab-btn:hover { color: var(--ink); }
.tab-btn.active { color: var(--ink); font-weight: 700; border-bottom-color: var(--red); }
.tab-num {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-4);
  letter-spacing: 0.05em;
  font-weight: 400;
}
.tab-btn.active .tab-num { color: var(--red); }

/* ─────────────────────────────────── MAIN */
main {
  max-width: var(--max);
  margin: 0 auto;
  padding: 56px var(--pad) 88px;
}
.panel { display: none; }
.panel.active { display: block; animation: fadeIn .35s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.sec-eye {
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: none;
  color: #fff;
  background: var(--red);
  border-radius: 4px;
  padding: 5px 12px;
  margin-bottom: 12px;
  display: inline-flex; align-items: center; gap: 8px;
}
.sec-eye::before { display: none; }
h2 {
  font-family: var(--serif);
  font-weight: 900;
  font-size: clamp(26px, 3.6vw, 38px);
  color: var(--ink);
  line-height: 1.25;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
  letter-spacing: -0.012em;
}
h3 {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 21px;
  color: var(--ink);
  margin: 40px 0 14px;
  line-height: 1.45;
  letter-spacing: -0.005em;
}
h3.sub, h4.sub {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 17px;
  color: var(--ink);
  margin: 28px 0 10px;
}
h4 {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 17px;
  color: var(--ink);
  margin: 26px 0 10px;
  line-height: 1.5;
}
.para { margin: 10px 0; color: var(--ink-2); }
.sec-lede {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 16.5px;
  color: var(--ink-2);
  line-height: 1.8;
  margin-bottom: 24px;
  max-width: 720px;
}

/* ─────────────────────────────────── BOX */
.box {
  padding: 16px 22px;
  margin: 18px 0;
  background: var(--paper-2);
  border: 0;
  border-left: 4px solid var(--ink-4);
  border-radius: 0 6px 6px 0;
}
.box-label {
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.01em;
  text-transform: none;
  color: var(--ink);
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.box-red { border-left-color: var(--red); background: var(--red-wash); }
.box-red .box-label { color: var(--red); }
.box-red strong { color: var(--red-deep); }
.box-warn { border-left-color: var(--amber); background: var(--amber-wash); }
.box-warn .box-label { color: var(--amber); }
.box-gray { border-left-color: var(--ink-4); background: var(--paper-2); }
.box p { color: var(--ink-2); line-height: 1.78; }
.box p + p { margin-top: 8px; }
.box strong { color: var(--ink); }

/* ─────────────────────────────────── LIST */
.list { list-style: none; margin: 14px 0; padding: 0; }
.list li {
  padding-left: 22px;
  position: relative;
  margin: 6px 0;
  color: var(--ink-2);
  line-height: 1.72;
}
.list li::before {
  content: '';
  position: absolute;
  left: 0; top: 14px;
  width: 8px; height: 1px;
  background: var(--red);
}
.list li.accent { color: var(--red); font-weight: 700; }

/* ─────────────────────────────────── STEPS */
.steps { display: flex; flex-direction: column; gap: 0; margin: 18px 0; border-top: 1px solid var(--line); }
.step {
  display: grid;
  grid-template-columns: 80px 1fr;
  background: transparent;
  border-bottom: 1px solid var(--line);
  align-items: stretch;
}
.step-num {
  background: transparent;
  color: var(--red);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 700;
  text-align: center;
  padding: 16px 8px;
  line-height: 1.4;
  letter-spacing: 0.06em;
  border-right: 1px solid var(--line);
  word-break: keep-all;
}
.step-num.gray { color: var(--ink-3); }
.step-num.dark { color: var(--ink); }
.step-num.warn { color: var(--amber); font-size: 11px; }
.step-body { padding: 16px 22px; }
.step-body h4 {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 16.5px;
  color: var(--ink);
  margin: 0 0 6px;
  line-height: 1.5;
}
.step-body p { font-size: 15px; color: var(--ink-2); margin: 0; line-height: 1.72; }
.step-body ul { list-style: none; margin-top: 10px; padding: 0; }
.step-body ul li {
  font-size: 14.5px;
  color: var(--ink-2);
  padding-left: 16px;
  position: relative;
  margin: 4px 0;
  line-height: 1.68;
}
.step-body ul li::before {
  content: '';
  position: absolute; left: 0; top: 12px;
  width: 6px; height: 1px;
  background: var(--ink-4);
}
.step-body ul li.urg { color: var(--red); }
.step-body ul li.urg::before { background: var(--red); }
.step-body .step-link {
  display: inline-block;
  margin-top: 12px;
  color: var(--red);
  font-weight: 500;
  font-size: 14px;
  border-bottom: 1px solid var(--red-soft);
  padding-bottom: 1px;
}
.step-body .step-link:hover { border-bottom-color: var(--red); }

/* ─────────────────────────────────── GRID (cards) */
.grid { display: grid; gap: 12px; margin: 18px 0; background: transparent; border: 0; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.cell {
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 18px 22px;
  display: flex; flex-direction: column; gap: 6px;
  transition: background .15s, border-color .15s;
}
.cell:hover { background: #EFEEEB; }
.cell.accent { border-color: var(--red-soft); background: var(--red-wash); }
.cell .cell-num {
  font-family: var(--sans);
  font-size: 11.5px;
  color: var(--red);
  letter-spacing: 0.1em;
  font-weight: 700;
  text-transform: uppercase;
}
.cell.accent .cell-num { color: var(--red); }
.cell .cell-title {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 16.5px;
  color: var(--ink);
  line-height: 1.5;
  letter-spacing: 0.005em;
}
.cell.accent .cell-title { color: var(--red-deep); }
.cell .cell-body {
  font-size: 15px;
  color: var(--ink-2);
  line-height: 1.72;
  margin-top: 4px;
}

/* ─────────────────────────────────── TABLE */
.tbl {
  width: 100%;
  border-collapse: collapse;
  margin: 18px 0;
  font-size: 14.5px;
  border: 0;
}
.tbl th {
  background: var(--red);
  color: #fff;
  padding: 10px 14px;
  text-align: left;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.02em;
  text-transform: none;
  border-bottom: 0;
}
.tbl td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line-2);
  background: transparent;
  vertical-align: top;
  line-height: 1.65;
  color: var(--ink-2);
}
.tbl tbody tr:nth-child(even) td { background: var(--line-soft); }
.tbl td:first-child { color: var(--red); font-weight: 700; }
.tbl tr:last-child td { border-bottom: 1px solid var(--line); }
.tbl td.center, .tbl th.center { text-align: center; }
.tbl strong { color: var(--ink); }

/* ─────────────────────────────────── SCORE TABLE (refined) */
.stbl { font-size: 14px; }
.stbl th { background: var(--ink); color: var(--white); border-bottom: 0; }
.stbl td { font-family: var(--mono); font-weight: 500; font-size: 13.5px; }
.stbl td:first-child { font-family: var(--sans); font-weight: 500; color: var(--ink); }
.stbl td.c-red    { background: var(--red-wash);   color: var(--red-deep);  font-weight: 700; }
.stbl td.c-yellow { background: var(--amber-wash); color: var(--amber);     font-weight: 700; }
.stbl td.c-green  { background: var(--green-wash); color: var(--green);     font-weight: 700; }
.stbl td.c-lgreen { background: #F1F6E1;           color: #5C7A2A;          font-weight: 700; }

/* ─────────────────────────────────── AGENDA */
.agenda { margin: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ag-row {
  display: grid;
  grid-template-columns: 88px 1fr;
  gap: 0;
  border-bottom: 1px solid var(--line-2);
  align-items: stretch;
  position: relative;
}
.ag-row:last-child { border-bottom: 0; }
.ag-time {
  background: transparent;
  color: var(--ink-3);
  padding: 12px 8px;
  font-family: var(--mono);
  font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  line-height: 1.4;
  letter-spacing: 0.04em;
  border-right: 1px solid var(--line);
}
.ag-line { display: none; }
.ag-body {
  padding: 12px 20px;
}
.ag-row.key .ag-time { color: var(--red); font-weight: 700; }
.ag-row.key { background: var(--red-wash); }
.ag-row.key .ag-body { background: var(--red-wash); }
.ag-body .ag-title {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 15.5px;
  color: var(--ink);
  display: block;
  margin-bottom: 4px;
  line-height: 1.5;
}
.ag-body .ag-desc { font-size: 14px; color: var(--ink-2); line-height: 1.65; }
.ag-badge {
  display: inline-block;
  background: var(--red);
  color: white;
  font-size: 10px;
  font-family: var(--mono);
  font-weight: 500;
  padding: 2px 7px;
  margin-left: 8px;
  vertical-align: 2px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ─────────────────────────────────── VCP */
.vcp {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 1px;
  margin: 24px 0;
  background: var(--line);
  border: 1px solid var(--line);
  position: relative;
}
.vcp::before {
  content: '';
  position: absolute;
  top: 56px; left: 8%; right: 8%;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--red-soft) 20%, var(--red-soft) 80%, transparent);
  z-index: 0;
}
.vcp-step {
  background: var(--white);
  padding: 28px 24px 24px;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  position: relative;
  z-index: 1;
}
.vcp-letter {
  font-family: var(--serif);
  font-weight: 900;
  font-size: 56px;
  color: var(--red);
  line-height: 1;
  width: 88px; height: 88px;
  display: flex; align-items: center; justify-content: center;
  background: var(--white);
  border: 1px solid var(--red-soft);
  border-radius: 50%;
  margin-bottom: 8px;
}
.vcp-step h4 {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 16.5px;
  color: var(--ink);
  margin: 0;
  line-height: 1.4;
}
.vcp-step p {
  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.7;
  margin: 0;
  max-width: 220px;
}
.vcp-step .vcp-period {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--red);
  letter-spacing: 0.18em;
  margin-top: 8px;
  font-weight: 500;
  text-transform: uppercase;
}
.vcp-arrow { display: none; }

/* ─────────────────────────────────── THEME */
.theme-box {
  background: var(--ink);
  color: var(--paper);
  padding: 30px 36px;
  margin: 18px 0;
  position: relative;
}
.theme-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 4px; height: 56px;
  background: var(--red);
}
.theme-title {
  font-family: var(--serif);
  font-weight: 900;
  font-size: 23px;
  color: var(--paper);
  margin-bottom: 10px;
  line-height: 1.35;
  letter-spacing: -0.005em;
}
.theme-desc {
  color: var(--ink-4);
  line-height: 1.78;
  font-size: 15px;
  font-family: var(--serif);
}

/* ─────────────────────────────────── ZOOM */
.zoom-box {
  display: grid;
  grid-template-columns: 1.1fr 1.4fr 1fr;
  gap: 0;
  background: var(--night);
  color: var(--white);
  margin: 20px 0;
  position: relative;
  overflow: hidden;
}
.zoom-time {
  text-align: center;
  padding: 28px 24px;
  border-right: 1px solid rgba(255,255,255,.08);
  display: flex; flex-direction: column; justify-content: center; gap: 4px;
}
.zoom-day {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 4px;
}
.zoom-clock {
  font-family: var(--serif);
  font-size: 44px;
  font-weight: 900;
  color: var(--white);
  line-height: 1;
  letter-spacing: -0.01em;
}
.zoom-clock small {
  font-size: 14px;
  color: var(--ink-4);
  font-weight: 400;
  letter-spacing: 0;
}
.zoom-day-ja {
  font-size: 11.5px;
  color: var(--ink-4);
  margin-top: 8px;
  font-family: var(--mono);
  letter-spacing: 0.08em;
}
.zoom-info {
  padding: 28px 26px;
  display: flex; flex-direction: column; justify-content: center; gap: 10px;
  border-right: 1px solid rgba(255,255,255,.08);
}
.zoom-info p {
  font-size: 10px;
  color: var(--ink-4);
  margin: 0;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-family: var(--mono);
}
.zoom-info strong {
  font-family: var(--mono);
  font-size: 18px;
  color: var(--white);
  letter-spacing: 0.02em;
  display: block;
  margin: 4px 0 0;
  font-weight: 500;
}
.zoom-link {
  padding: 20px;
  display: flex; flex-direction: column; justify-content: center; gap: 8px;
}
.zoom-link a {
  display: block;
  background: var(--red);
  color: white;
  text-decoration: none;
  padding: 14px 22px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-align: center;
  text-transform: uppercase;
  font-family: var(--sans);
  transition: background .15s;
  border: 0;
}
.zoom-link a:hover { background: var(--red-deep); text-decoration: none; }
.zoom-link small {
  display: block;
  font-size: 10.5px;
  color: var(--ink-4);
  text-align: center;
  font-family: var(--mono);
  letter-spacing: 0.08em;
}

/* ─────────────────────────────────── CHECKLIST */
.checklist { margin: 18px 0; border-top: 1px solid var(--line); }
.cl-item {
  display: grid;
  grid-template-columns: 64px 1fr;
  gap: 0;
  background: transparent;
  border-bottom: 1px solid var(--line);
}
.cl-num {
  background: transparent;
  color: var(--red);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono);
  font-size: 14.5px;
  font-weight: 500;
  border-right: 1px solid var(--line);
}
.cl-body { padding: 14px 20px; }
.cl-body h4 {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  margin: 0 0 4px;
  line-height: 1.5;
}
.cl-body p { font-size: 14.5px; color: var(--ink-2); margin: 0; line-height: 1.7; }

/* ─────────────────────────────────── TIERS */
.tiers { margin: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.tier {
  display: grid;
  grid-template-columns: 220px 1fr;
  border-bottom: 1px solid var(--line-2);
  background: transparent;
}
.tier:last-child { border-bottom: 0; }
.tier-lbl {
  background: transparent;
  color: var(--ink-2);
  padding: 14px 20px 14px 0;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  display: flex; align-items: center;
  border-right: 1px solid var(--line);
}
.tier-lbl.urg { color: var(--red); }
.tier-lbl.dark { color: var(--ink); font-weight: 700; }
.tier-body { padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  display: inline-block;
  background: var(--white);
  border: 1px solid var(--line);
  padding: 5px 10px;
  font-size: 13px;
  color: var(--ink-2);
  letter-spacing: 0.01em;
}
.pill.urg { background: var(--red-wash); border-color: var(--red-soft); color: var(--red-deep); font-weight: 500; }

/* ─────────────────────────────────── LINKS */
.links { margin: 14px 0; }
.links-heading {
  margin: 22px 0 6px;
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-family: var(--mono);
  font-weight: 500;
  display: flex; align-items: center; gap: 10px;
}
.links-heading::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}
.lnk {
  display: grid;
  grid-template-columns: 36px 1fr 16px;
  align-items: center;
  background: transparent;
  border-bottom: 1px solid var(--line);
  padding: 12px 4px;
  text-decoration: none;
  transition: padding .15s;
  gap: 14px;
}
.lnk:hover { background: var(--paper-2); padding-left: 12px; padding-right: 12px; text-decoration: none; }
.lnk-icon { font-size: 18px; opacity: .8; }
.lnk-text { display: flex; flex-direction: column; gap: 2px; }
.lnk-text strong {
  font-family: var(--serif);
  font-size: 15.5px;
  color: var(--ink);
  font-weight: 700;
  letter-spacing: 0.005em;
}
.lnk-text span {
  font-size: 13px;
  color: var(--ink-3);
  letter-spacing: 0.01em;
}
.lnk-arr { color: var(--red); font-size: 11px; }

/* ─────────────────────────────────── MENTOR TABLE */
.mtbl { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 14.5px; border-top: 1px solid var(--line); }
.mtbl th {
  background: transparent;
  color: var(--ink-3);
  padding: 10px 12px;
  text-align: left;
  font-weight: 500;
  font-size: 11px;
  font-family: var(--mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--line);
}
.mtbl td {
  padding: 12px 12px;
  border-bottom: 1px solid var(--line-2);
  background: transparent;
  line-height: 1.55;
  vertical-align: top;
  color: var(--ink-2);
}
.mtbl tr:last-child td { border-bottom: 1px solid var(--line); }
.mtbl td.mn {
  font-family: var(--mono);
  font-weight: 500;
  color: var(--red);
  font-size: 13px;
  letter-spacing: 0.04em;
}
.mtbl td.mrole { font-size: 13px; color: var(--ink-3); font-family: var(--mono); letter-spacing: 0.02em; }
.mtbl td.mname {
  font-family: var(--serif);
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
  font-size: 15px;
}

/* ─────────────────────────────────── GLOSSARY */
.glossary { margin: 18px 0; border-top: 1px solid var(--line); }
.term {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 0;
  border-bottom: 1px solid var(--line-2);
  background: transparent;
}
.term:last-child { border-bottom: 1px solid var(--line); }
.term dt {
  padding: 14px 20px 14px 0;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 15.5px;
  color: var(--red);
  border-right: 1px solid var(--line);
  letter-spacing: 0.005em;
}
.term dd {
  padding: 14px 0 14px 20px;
  font-size: 14.5px;
  color: var(--ink-2);
  line-height: 1.7;
}

/* ─────────────────────────────────── FAQ */
.faq { margin: 18px 0; border-top: 1px solid var(--line); }
.faq-cat {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  color: var(--ink-3);
  margin: 28px 0 6px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  text-transform: uppercase;
  font-weight: 500;
  display: flex; align-items: center; gap: 10px;
}
.faq:first-child .faq-cat:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.faq-item {
  background: transparent;
  border-bottom: 1px solid var(--line-2);
  margin-bottom: 0;
}
.faq-q {
  padding: 16px 0;
  background: transparent;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  cursor: pointer;
  display: flex; align-items: flex-start; gap: 14px;
  user-select: none;
  line-height: 1.55;
  transition: color .15s;
}
.faq-q:hover { color: var(--red); }
.faq-q::before {
  content: 'Q';
  font-family: var(--mono);
  color: var(--red);
  font-weight: 500;
  font-size: 13px;
  flex-shrink: 0;
  margin-top: 4px;
  letter-spacing: 0.02em;
}
.faq-q::after {
  content: '＋';
  margin-left: auto;
  color: var(--ink-3);
  font-size: 16px;
  font-weight: 300;
  flex-shrink: 0;
  transition: transform .25s, color .15s;
  margin-top: 2px;
}
.faq-item.open .faq-q::after { content: '−'; color: var(--red); }
.faq-a {
  padding: 0 0 0 28px;
  max-height: 0;
  overflow: hidden;
  transition: max-height .35s ease, padding .35s ease;
  font-size: 15px;
  line-height: 1.78;
  color: var(--ink-2);
}
.faq-a ul { margin: 8px 0 0 18px; }
.faq-a li { margin: 4px 0; }
.faq-item.open .faq-a {
  max-height: 1200px;
  padding: 0 0 18px 28px;
}

/* ─────────────────────────────────── FOOTER */
footer {
  background: var(--paper);
  border-top: 1px solid var(--line);
  color: var(--ink-3);
  padding: 40px var(--pad);
  margin-top: 56px;
  text-align: center;
  font-size: 12px;
  line-height: 1.7;
  letter-spacing: 0.02em;
}
footer .ft-eye {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 10px;
}
footer a { color: var(--ink); }

/* ─────────────────────────────────── RESPONSIVE */
@media (max-width: 760px) {
  :root { --pad: 24px; }
  header { padding: 36px 0 28px; }
  .hdr-inner { gap: 0; }
  .hdr-leaders { padding-top: 18px; border-top: 1px solid rgba(255,255,255,.25); }
  .tab-nav-inner { padding: 0 16px; gap: 0; }
  .tab-btn { padding: 12px 10px 11px; font-size: 12.5px; gap: 6px; }
  main { padding: 36px var(--pad) 64px; }
  h2 { margin-bottom: 24px; padding-bottom: 16px; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .ag-row { grid-template-columns: 72px 1fr; }
  .ag-time { font-size: 10.5px; padding: 10px 6px; }
  .ag-body { padding: 12px 16px; }
  .vcp { grid-template-columns: 1fr; }
  .vcp::before { display: none; }
  .zoom-box { grid-template-columns: 1fr; }
  .zoom-time { border-right: 0; border-bottom: 1px solid rgba(255,255,255,.08); padding: 28px 24px; }
  .zoom-info { border-right: 0; border-bottom: 1px solid rgba(255,255,255,.08); padding: 24px; }
  .tier { grid-template-columns: 1fr; }
  .tier-lbl { border-right: 0; border-bottom: 1px solid var(--line-2); padding: 12px 0 8px; }
  .term { grid-template-columns: 1fr; }
  .term dt { padding: 14px 0 4px; border-right: 0; }
  .term dd { padding: 0 0 14px; }
  .step { grid-template-columns: 56px 1fr; }
  .step-num { padding: 14px 4px; font-size: 11px; }
  .step-body { padding: 14px 18px; }
  .cl-item { grid-template-columns: 48px 1fr; }
  .lnk { grid-template-columns: 28px 1fr 14px; padding: 14px 4px; gap: 12px; }
  .lnk:hover { padding-left: 8px; padding-right: 8px; }
  .theme-box { padding: 24px 22px; }
  .theme-title { font-size: 21px; }
  hr { margin: 32px 0; }
  h3 { margin: 32px 0 12px; font-size: 20px; }
}
@media (min-width: 761px) and (max-width: 960px) {
  .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="hdr-inner">
    <div>
      <div class="hdr-eye" id="hdr-eye"></div>
      <h1 id="hdr-title"></h1>
      <div class="hdr-sub" id="hdr-sub"></div>
    </div>
    <div class="hdr-leaders" id="hdr-leaders"></div>
  </div>
</header>

<nav class="tab-nav">
  <div class="tab-nav-inner" id="tab-nav-inner"></div>
</nav>

<main id="main"></main>

<footer>
  <div class="ft-eye">BNI AQUA — Chapter Operations Guide</div>
  <div id="ft-text"></div>
</footer>

<script>
(function () {
  function resolve(s) {
    if (typeof s !== 'string') return s;
    return s
      .replace(/\$\{LINK:(\w+)\}/g,    (_, k) => (window.LINKS && window.LINKS[k]) || '#')
      .replace(/\$\{ZOOM:(\w+)\}/g,    (_, k) => (window.ZOOM_INFO && window.ZOOM_INFO[k]) || '')
      .replace(/\$\{FEE:(\w+)\}/g,     (_, k) => (window.FEES && window.FEES[k]) || '')
      .replace(/\$\{MENTOR_COORDINATOR\}/g, () => (window.MENTOR_COORDINATOR && window.MENTOR_COORDINATOR.name) || '');
  }

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = resolve(html);
    return e;
  }

  const RENDER = {
    para: (b) => el('p', 'para', b.html),
    h3:   (b) => el('h3', b.sub ? 'sub' : null, b.text),
    h4:   (b) => el('h4', b.sub ? 'sub' : null, b.text),
    divider: () => document.createElement('hr'),

    box: (b) => {
      const variant = b.variant || 'gray';
      const box = el('div', 'box box-' + variant);
      if (b.label) box.appendChild(el('div', 'box-label', b.label));
      if (b.html)  box.appendChild(el('p', null, b.html));
      return box;
    },

    list: (b) => {
      const ul = el('ul', 'list');
      (b.items || []).forEach((it) => {
        const isObj = typeof it === 'object';
        const li = el('li', isObj && it.accent ? 'accent' : null, isObj ? it.text : it);
        ul.appendChild(li);
      });
      return ul;
    },

    steps: (b) => {
      const wrap = el('div', 'steps');
      (b.items || []).forEach((it) => {
        const step = el('div', 'step');
        const numCls = 'step-num' + (it.variant ? ' ' + it.variant : '');
        const num = el('div', numCls);
        num.textContent = it.label || '';
        step.appendChild(num);
        const body = el('div', 'step-body');
        if (it.title) body.appendChild(el('h4', null, it.title));
        if (it.desc)  body.appendChild(el('p', null, it.desc));
        if (it.list) {
          const ul = document.createElement('ul');
          it.list.forEach((x) => ul.appendChild(el('li', null, x)));
          body.appendChild(ul);
        }
        if (it.link) {
          const a = el('a', 'step-link');
          a.href = resolve(it.link.url);
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = it.link.text;
          body.appendChild(a);
        }
        step.appendChild(body);
        wrap.appendChild(step);
      });
      return wrap;
    },

    grid: (b) => {
      const cols = b.cols || 2;
      const wrap = el('div', 'grid grid-' + cols);
      (b.cells || []).forEach((c) => {
        const cellCls = 'cell' + (c.accent ? ' accent' : '');
        const cell = el('div', cellCls);
        if (c.num)   cell.appendChild(el('div', 'cell-num', c.num));
        if (c.title) cell.appendChild(el('div', 'cell-title', c.title));
        if (c.body)  cell.appendChild(el('div', 'cell-body', c.body));
        wrap.appendChild(cell);
      });
      return wrap;
    },

    table: (b) => {
      const t = el('table', 'tbl');
      if (b.head) {
        const tr = document.createElement('tr');
        b.head.forEach((h) => tr.appendChild(el('th', null, h)));
        t.appendChild(tr);
      }
      (b.rows || []).forEach((r) => {
        const tr = document.createElement('tr');
        r.forEach((c) => tr.appendChild(el('td', null, c)));
        t.appendChild(tr);
      });
      return t;
    },

    'score-table': (b) => {
      const t = el('table', 'tbl stbl');
      const center = new Set(b.centerCols || []);
      if (b.head) {
        const tr = document.createElement('tr');
        b.head.forEach((h, i) => tr.appendChild(el('th', center.has(i) ? 'center' : null, h)));
        t.appendChild(tr);
      }
      (b.rows || []).forEach((r) => {
        const tr = document.createElement('tr');
        r.forEach((c, i) => {
          if (c && typeof c === 'object') {
            const td = el('td', 'center c-' + (c.c || ''), c.v);
            tr.appendChild(td);
          } else {
            const td = el('td', center.has(i) ? 'center' : null, c);
            tr.appendChild(td);
          }
        });
        t.appendChild(tr);
      });
      return t;
    },

    agenda: (b) => {
      const wrap = el('div', 'agenda');
      const breakoutLink = (window.LINKS && window.LINKS.breakoutRoom) || '#';
      (b.rows || []).forEach((r) => {
        const row = el('div', 'ag-row' + (r.key ? ' key' : ''));
        row.appendChild(el('div', 'ag-time', r.time));
        const body = el('div', 'ag-body');
        const title = el('span', 'ag-title');
        title.innerHTML = resolve(r.title || '') + (r.badge ? ' <span class="ag-badge">' + r.badge + '</span>' : '');
        body.appendChild(title);
        if (r.desc) {
          let descHtml = resolve(r.desc);
          if (r.breakoutLink) descHtml += ' <a href="' + breakoutLink + '" target="_blank" rel="noopener" style="color:var(--red);font-weight:500;">▶ ルーム確認</a>';
          body.appendChild(el('span', 'ag-desc', descHtml));
        }
        row.appendChild(body);
        wrap.appendChild(row);
      });
      return wrap;
    },

    vcp: (b) => {
      const wrap = el('div', 'vcp');
      (b.steps || []).forEach((s) => {
        const step = el('div', 'vcp-step');
        step.appendChild(el('div', 'vcp-letter', s.letter));
        step.appendChild(el('h4', null, s.title));
        if (s.desc) step.appendChild(el('p', null, s.desc));
        if (s.period) step.appendChild(el('div', 'vcp-period', s.period));
        wrap.appendChild(step);
      });
      return wrap;
    },

    theme: () => {
      const t = window.THEME || {};
      const wrap = el('div', 'theme-box');
      wrap.appendChild(el('div', 'theme-title', t.title || ''));
      if (t.description) wrap.appendChild(el('div', 'theme-desc', t.description));
      return wrap;
    },

    zoom: () => {
      const z = window.ZOOM_INFO || {};
      const wrap = el('div', 'zoom-box');
      const time = el('div', 'zoom-time');
      time.appendChild(el('div', 'zoom-day', z.dayLabel || ''));
      time.appendChild(el('div', 'zoom-clock', (z.startTime || '') + '<small>〜' + (z.endTime || '') + '</small>'));
      time.appendChild(el('div', 'zoom-day-ja', z.dayLabelJa || ''));
      const info = el('div', 'zoom-info');
      const wrapItem = (label, val) => {
        const div = document.createElement('div');
        div.appendChild(el('p', null, label));
        div.appendChild(el('strong', null, val));
        return div;
      };
      info.appendChild(wrapItem('Meeting ID', z.meetingId || ''));
      info.appendChild(wrapItem('Passcode',   z.passcode  || ''));
      const link = el('div', 'zoom-link');
      const a = document.createElement('a');
      a.href = z.zoomUrl || '#';
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'Zoom 入室';
      link.appendChild(a);
      const small = document.createElement('small');
      small.textContent = 'Click to join';
      link.appendChild(small);
      wrap.appendChild(time);
      wrap.appendChild(info);
      wrap.appendChild(link);
      return wrap;
    },

    checklist: (b) => {
      const wrap = el('div', 'checklist');
      (b.items || []).forEach((it) => {
        const item = el('div', 'cl-item');
        item.appendChild(el('div', 'cl-num', it.label || ''));
        const body = el('div', 'cl-body');
        if (it.title) body.appendChild(el('h4', null, it.title));
        if (it.desc)  body.appendChild(el('p', null, it.desc));
        if (it.linkUrl) {
          const a = document.createElement('a');
          a.href = resolve(it.linkUrl);
          a.target = '_blank';
          a.rel = 'noopener';
          a.style.cssText = 'display:inline-block;margin-top:8px;color:var(--red);font-weight:500;font-size:13px;border-bottom:1px solid var(--red-soft);';
          a.textContent = '▶ ' + (it.linkText || it.linkUrl);
          body.appendChild(a);
        }
        item.appendChild(body);
        wrap.appendChild(item);
      });
      return wrap;
    },

    tiers: (b) => {
      const wrap = el('div', 'tiers');
      (b.rows || []).forEach((r) => {
        const tier = el('div', 'tier');
        tier.appendChild(el('div', 'tier-lbl' + (r.variant ? ' ' + r.variant : ''), r.label || ''));
        const body = el('div', 'tier-body');
        (r.items || []).forEach((p) => {
          const pillCls = 'pill' + (r.variant === 'urg' ? ' urg' : '');
          body.appendChild(el('span', pillCls, p));
        });
        tier.appendChild(body);
        wrap.appendChild(tier);
      });
      return wrap;
    },

    links: (b) => {
      const wrap = el('div', 'links');
      (b.groups || []).forEach((g) => {
        if (g.heading) wrap.appendChild(el('div', 'links-heading', g.heading));
        (g.items || []).forEach((it) => {
          const a = document.createElement('a');
          a.className = 'lnk';
          a.href = resolve(it.url || '#');
          a.target = '_blank';
          a.rel = 'noopener';
          a.appendChild(el('span', 'lnk-icon', it.icon || '↗'));
          const text = el('div', 'lnk-text');
          text.appendChild(el('strong', null, it.title || ''));
          if (it.sub) text.appendChild(el('span', null, it.sub));
          a.appendChild(text);
          a.appendChild(el('span', 'lnk-arr', '→'));
          wrap.appendChild(a);
        });
      });
      return wrap;
    },

    'mentor-table': () => {
      const t = el('table', 'mtbl');
      const tr = document.createElement('tr');
      ['No.', 'Topic', 'Role', 'Mentor'].forEach((h, i) => {
        const th = el('th', null, h);
        if (i === 0) th.style.width = '50px';
        if (i === 2) th.style.width = '180px';
        if (i === 3) th.style.width = '80px';
        tr.appendChild(th);
      });
      t.appendChild(tr);
      (window.MENTORS || []).forEach((m) => {
        const row = document.createElement('tr');
        row.appendChild(el('td', 'mn',    m.num));
        row.appendChild(el('td', null,    m.topic));
        row.appendChild(el('td', 'mrole', m.role));
        row.appendChild(el('td', 'mname', m.name));
        t.appendChild(row);
      });
      return t;
    },

    glossary: (b) => {
      const wrap = el('div', 'glossary');
      (b.items || []).forEach((g) => {
        const dl = el('dl', 'term');
        dl.appendChild(el('dt', null, g.term));
        dl.appendChild(el('dd', null, g.def));
        wrap.appendChild(dl);
      });
      return wrap;
    },

    faq: (b) => {
      const wrap = el('div', 'faq');
      let currentCat = '';
      (b.items || []).forEach((it) => {
        if (it.cat && it.cat !== currentCat) {
          currentCat = it.cat;
          wrap.appendChild(el('div', 'faq-cat', it.cat));
        }
        const item = el('div', 'faq-item');
        const q = el('div', 'faq-q', it.q);
        const a = el('div', 'faq-a', it.a);
        q.addEventListener('click', () => item.classList.toggle('open'));
        item.appendChild(q);
        item.appendChild(a);
        wrap.appendChild(item);
      });
      return wrap;
    },
  };

  function renderBlock(b) {
    const fn = RENDER[b.type];
    return fn ? fn(b) : el('div', null, '');
  }

  function renderSection(sec) {
    const panel = el('section', 'panel');
    panel.id = 'panel-' + sec.id;
    if (sec.eyebrow) panel.appendChild(el('div', 'sec-eye', sec.eyebrow));
    if (sec.title)   panel.appendChild(el('h2', null, sec.title));
    if (sec.lede)    panel.appendChild(el('p', 'sec-lede', sec.lede));
    (sec.blocks || []).forEach((b) => panel.appendChild(renderBlock(b)));
    return panel;
  }

  function activate(id) {
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === id));
    document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('active', p.id === 'panel-' + id));
    window.scrollTo({ top: 0, behavior: 'smooth' });
    history.replaceState(null, '', '#' + id);
  }

  function init() {
    const info = window.SITE_INFO || {};
    const sections = window.SECTIONS || [];

    document.title = info.pageTitle || 'BNI AQUA チャプター運営ガイド';
    document.getElementById('hdr-eye').textContent = info.region || '';
    document.getElementById('hdr-title').innerHTML = info.titleHtml || '';
    document.getElementById('hdr-sub').textContent = info.headerSubtitle || '';
    document.getElementById('ft-text').innerHTML  = info.footerHtml || '';

    const ldrs = document.getElementById('hdr-leaders');
    (window.LEADERS || []).forEach((l) => {
      const d = el('div', 'ldr');
      d.appendChild(el('span', 'role', l.role));
      d.appendChild(el('span', 'name', l.name));
      ldrs.appendChild(d);
    });

    const nav  = document.getElementById('tab-nav-inner');
    const main = document.getElementById('main');
    sections.forEach((sec, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tab-btn';
      btn.dataset.tab = sec.id;
      const num = el('span', 'tab-num', String(i + 1).padStart(2, '0'));
      const lbl = document.createElement('span');
      lbl.textContent = sec.navLabel || sec.title;
      btn.appendChild(num);
      btn.appendChild(lbl);
      btn.addEventListener('click', () => activate(sec.id));
      nav.appendChild(btn);
      main.appendChild(renderSection(sec));
    });

    const startId = (location.hash || '').replace(/^#/, '') || (sections[0] && sections[0].id);
    if (startId) activate(startId);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
